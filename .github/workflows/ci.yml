name: Build and test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project FamilyHealth.xcodeproj \
            -scheme FamilyHealth \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: Show why tests failed
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path TestResults.xcresult \
            | python3 -c '
          import json, sys
          def walk(node, path=""):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message" or (node.get("nodeType") == "Test Case" and node.get("result") == "Failed"):
                  print(node.get("nodeType"), "|", path, "|", name)
              for child in node.get("children", []):
                  walk(child, path + "/" + name)
          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root)
          ' || true
          find ~/Library/Logs/DiagnosticReports -name "FamilyHealth*" -mmin -60 -exec head -80 {} \; 2>/dev/null || true
